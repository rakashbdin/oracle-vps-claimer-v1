name: Oracle ARM Instance Auto-Claimer

on:
  schedule:
    # Runs automatically every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to also trigger it manually with a click

jobs:
  claim-instance:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

    steps:
      - name: Install and Configure OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'iam region list'

      - name: Request Free ARM Instance
        run: |
          echo "Sending instance creation request to Mumbai..."
          
          # Added "|| true" at the end of the command so GitHub won't force-crash here
          OUTPUT=$(oci compute instance launch \
            --availability-domain "nLVy:AP-MUMBAI-1-AD-1" \
            --compartment-id "ocid1.tenancy.oc1..aaaaaaaazojjfrsvoyusptr6r6bfhfi6d4smv734ne6e5hhgp5j3jfskaixq" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --image-id "ocid1.image.oc1.ap-mumbai-1.aaaaaaaay2gm4bht5gaf4ubvmimpprarmnceguytmzrfufmqfmmvgpul6z5a" \
            --subnet-id "ocid1.subnet.oc1.ap-mumbai-1.aaaaaaa3vqvbmtehltzufkazsx6bdb2kzkjwxkhzfrm2dbart75il3mjvma" \
            --assign-public-ip true \
            --metadata '{"ssh_authorized_keys":"ssh-rsa  ssh-key-2026-07-14"}' 2>&1) || true

          if [[ $OUTPUT == *"ocid1.instance"* ]]; then
            echo "SUCCESS! ARM Instance Created."
            exit 0
          else
            echo "Out of capacity. Will try again in 5 minutes."
            echo "Oracle Error: $OUTPUT"
            exit 1
          fi
