name: Oracle ARM Instance Auto Claimer
# Scheduled workflow reactivated on 2026-09-30

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure OCI credentials
        shell: bash
        run: |
          mkdir -p ~/.oci

          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          printf "[DEFAULT]\nuser=${{ secrets.OCI_CLI_USER }}\nfingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}\ntenancy=${{ secrets.OCI_CLI_TENANCY }}\nregion=${{ secrets.OCI_CLI_REGION }}\nkey_file=/home/runner/.oci/oci_api_key.pem\n" > ~/.oci/config


      - name: Install OCI CLI
        run: |
          curl -L -o install_oci_cli.py https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.py
          python3 install_oci_cli.py --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH


      - name: Test OCI Authentication
        run: |
          oci iam region list


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        run: |
          terraform init


      - name: Try creating Oracle ARM instance
        shell: bash
        continue-on-error: true
        run: |

          echo "Starting Oracle ARM claim attempt..."

          terraform apply -auto-approve

          STATUS=$?

          if [ $STATUS -eq 0 ]; then
            echo "================================="
            echo "SUCCESS: Oracle ARM instance created"
            echo "================================="
          else
            echo "================================="
            echo "No capacity available"
            echo "Will retry after 5 minutes"
            echo "================================="
          fi

          exit 0
