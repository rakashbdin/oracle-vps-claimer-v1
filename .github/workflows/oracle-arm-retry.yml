name: Oracle ARM Instance Auto Claimer
# Scheduled workflow reactivated on 2026-09-30

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  claim-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure OCI credentials
        shell: bash
        run: |
          mkdir -p ~/.oci

          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          printf "[DEFAULT]\nuser=${{ secrets.OCI_CLI_USER }}\nfingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}\ntenancy=${{ secrets.OCI_CLI_TENANCY }}\nregion=${{ secrets.OCI_CLI_REGION }}\nkey_file=/home/runner/.oci/oci_api_key.pem\n" > ~/.oci/config


      - name: Install OCI CLI
        run: |
          curl -L -o install_oci_cli.py https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.py
          python3 install_oci_cli.py --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH


      - name: Test OCI Authentication
        run: |
          oci iam region list


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        run: |
          terraform init


      - name: Try creating Oracle ARM instance
        id: terraform_apply
        shell: bash
        run: |
          echo "Starting Oracle ARM claim attempt..."

          set +e
          terraform apply -auto-approve -no-color 2>&1 | tee apply_output.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "================================="
            echo "SUCCESS: Oracle ARM instance created"
            echo "================================="
            echo "result=success" >> "$GITHUB_OUTPUT"

          elif grep -qiE "Out of host capacity|Out of capacity|LimitExceeded.*capacity" apply_output.log; then
            echo "================================="
            echo "No capacity available right now - will retry in 5 minutes"
            echo "================================="
            echo "result=no_capacity" >> "$GITHUB_OUTPUT"

          else
            echo "================================="
            echo "REAL ERROR (not a capacity issue) - see log above"
            echo "================================="
            echo "result=real_error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open issue on successful claim
        if: steps.terraform_apply.outputs.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Oracle ARM instance claimed - run #${context.runNumber}`,
              body: `The Always Free Ampere A1 instance was created successfully in run ${context.runId}.\n\nCheck the OCI console to confirm it's reachable, then consider pausing this workflow's schedule.`,
              labels: ["success"]
            })
